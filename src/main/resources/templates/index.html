<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 30px 16px;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 {
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button {
            background: #4f46e5;
            color: white;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        li span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        li.done span {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .complete-button {
            background: #dcfce7;
            color: #166534;
        }

        .delete-button {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            color: #9ca3af;
            text-align: center;
            padding: 20px 0;
        }

        .footer {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Student Task Manager</h1>
        <p class="subtitle">Organize your studies, one task at a time.</p>

        <form id="task-form">
            <input id="task-input" type="text"
                   placeholder="Enter a new task..." required>
            <button class="add-button" type="submit">Add Task</button>
        </form>

        <p id="task-count">0 tasks</p>
        <ul id="task-list"></ul>

        <p class="footer">
            Student Task Manager | Built with Spring Boot
        </p>
    </main>

    <script>
        const form = document.getElementById("task-form");
        const input = document.getElementById("task-input");
        const list = document.getElementById("task-list");
        const count = document.getElementById("task-count");

        let tasks = [];
        let nextId = 1;

        function renderTasks() {
            list.replaceChildren();

            if (tasks.length === 0) {
                const empty = document.createElement("li");
                empty.className = "empty";
                empty.textContent = "No tasks yet. Add your first task!";
                list.appendChild(empty);
            }

            tasks.forEach(task => {
                const item = document.createElement("li");
                if (task.completed) item.className = "done";

                const text = document.createElement("span");
                text.textContent = task.title;

                const complete = document.createElement("button");
                complete.className = "complete-button";
                complete.textContent =
                    task.completed ? "Undo" : "Complete";
                complete.onclick = () => {
                    task.completed = !task.completed;
                    renderTasks();
                };

                const remove = document.createElement("button");
                remove.className = "delete-button";
                remove.textContent = "Delete";
                remove.onclick = () => {
                    tasks = tasks.filter(t => t.id !== task.id);
                    renderTasks();
                };

                item.append(text, complete, remove);
                list.appendChild(item);
            });

            const completed = tasks.filter(t => t.completed).length;
            count.textContent =
                `${tasks.length} tasks | ${completed} completed`;
        }

        form.addEventListener("submit", event => {
            event.preventDefault();
            const title = input.value.trim();
            if (!title) return;

            tasks.push({
                id: nextId++,
                title: title,
                completed: false
            });

            input.value = "";
            renderTasks();
        });

        renderTasks();
    </script>
</body>
</html>
